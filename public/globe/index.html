<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ParkEasy — every space on the map</title>
<meta name="ext-resource-dependency" content="data/countries-110m.json" data-resource-id="world" />
<meta name="ext-resource-dependency" content="data/ni-ireland.json" data-resource-id="niIreland" />
<meta name="ext-resource-dependency" content="data/parkeasy-places.json" data-resource-id="places" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- ABSOLUTE PATHS, NOT RELATIVE — and they have to stay that way.
     vercel.json rewrites /globe to /globe/index.html. A rewrite is not a
     redirect: the browser's URL stays "/globe", with no trailing slash, so a
     relative "./d3.min.js" resolves against "/" and asks for "/d3.min.js" at
     the site root. That 404s, d3 is never defined, and the page renders its
     chrome — heading, buttons, legend — with an empty canvas where the globe
     should be. It looks like a broken globe rather than a broken path, which
     is why it survived a deploy.
     The same applies to the three d3.json() loads further down. -->
<script src="/globe/config.js"></script>
<script src="/globe/d3.min.js"></script>
<script src="/globe/topojson-client.min.js"></script>
<style>
  :root{
    --bg:#0d1626;--ink:#EAF1F8;--muted:#8b9bb0;--accent:#2ED3C6;
    --line:rgba(234,241,248,.14);--rule:rgba(234,241,248,.9);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:#5BE7DA}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #stage{position:fixed;inset:0}

  .layer{position:absolute;inset:0;pointer-events:none;display:grid;
    grid-template-columns:minmax(300px,360px) 1fr;grid-template-rows:1fr auto;
    padding:clamp(18px,2.6vw,36px);gap:0 32px}

  .side{grid-row:1;grid-column:1;display:flex;flex-direction:column;min-height:0;pointer-events:auto}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;
    font-size:clamp(16px,1.4vw,20px);letter-spacing:-.02em;flex:0 0 auto}
  .brand span{width:9px;height:9px;background:var(--accent);display:block}

  .headline{margin-top:14px;transition:opacity .3s ease,max-height .4s ease;overflow:hidden}
  h1{margin:0;font-size:clamp(28px,3.6vw,50px);line-height:1.02;letter-spacing:-.035em;
    font-weight:700;max-width:13ch;text-wrap:balance}
  h1 em{font-style:normal;color:var(--accent)}
  .lede{margin:12px 0 0;max-width:34ch;color:#B7C2D0;font-size:14px;line-height:1.5;text-wrap:pretty}
  body:not([data-mode="globe"]) .headline,body[data-searching="1"] .headline{opacity:0;max-height:0;margin-top:0}

  .search{margin-top:18px;display:flex;border:2px solid var(--rule);flex:0 0 auto}
  .search input{flex:1;appearance:none;background:transparent;border:0;color:var(--ink);
    font:500 14px/1 Manrope, sans-serif;padding:14px 14px}
  .search input::placeholder{color:var(--muted)}
  .search input:focus{outline:none}
  .search:focus-within{border-color:var(--accent)}
  .search button{appearance:none;background:transparent;border:0;border-left:2px solid var(--rule);
    color:var(--muted);font:600 11px/1 Manrope, sans-serif;letter-spacing:.1em;padding:0 14px;cursor:pointer}
  .search button:hover{color:var(--ink)}

  .filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;flex:0 0 auto}
  .filters button{appearance:none;background:transparent;border:1px solid var(--line);color:var(--muted);
    font:600 10px/1 Manrope, sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:8px 10px;
    cursor:pointer;display:flex;align-items:center;gap:7px;transition:color .15s,border-color .15s}
  .filters button[aria-pressed="true"]{color:var(--ink);border-color:rgba(234,241,248,.5)}
  .filters button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .filters i{width:9px;height:9px;display:block;flex:0 0 9px}
  .sw-host{background:var(--accent)}
  .sw-partner{background:var(--accent);transform:rotate(45deg);width:8px;height:8px}
  .sw-paid{border:2px solid var(--accent);border-radius:50%}
  .sw-free{background:rgba(234,241,248,.85);border-radius:50%}
  .sw-gem{border:1.5px solid rgba(234,241,248,.8);border-radius:50%}
  /* Partners read as partners at a glance — a teal edge and a lift off the
     background. Labelled too, in the row's caption; a highlight that is only a
     colour is an advert pretending to be a search result. */
  .row.is-partner{background:rgba(46,211,198,.07);box-shadow:inset 2px 0 0 var(--accent)}
  .row.is-partner:hover{background:rgba(46,211,198,.13)}
  .row.is-partner s{color:var(--accent)}

  .results{margin-top:14px;overflow-y:auto;min-height:0;flex:1 1 auto;
    scrollbar-width:thin;scrollbar-color:rgba(234,241,248,.25) transparent;
    border-top:2px solid var(--rule)}
  .results::-webkit-scrollbar{width:4px}
  .results::-webkit-scrollbar-thumb{background:rgba(234,241,248,.25)}
  body[data-mode="globe"]:not([data-searching="1"]) .results,
  body[data-mode="globe"]:not([data-searching="1"]) .filters{display:none}
  .grp{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    font-weight:600;padding:14px 0 7px}
  .row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;appearance:none;
    background:transparent;border:0;border-bottom:1px solid rgba(234,241,248,.07);
    color:#D3DBE5;font:500 13px/1.3 Manrope, sans-serif;padding:9px 4px;cursor:pointer}
  .row:hover{background:rgba(46,211,198,.10);color:#fff}
  .row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .row i{width:9px;height:9px;flex:0 0 9px}
  .row s{margin-left:auto;text-decoration:none;color:var(--muted);font-size:10px;
    letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}
  .empty{color:var(--muted);font-size:13px;padding:16px 0;line-height:1.5}

  .detail{overflow-y:auto;min-height:0;flex:1 1 auto;margin-top:14px;
    border-top:2px solid var(--rule);scrollbar-width:thin;
    scrollbar-color:rgba(234,241,248,.25) transparent}
  .detail::-webkit-scrollbar{width:4px}
  .detail::-webkit-scrollbar-thumb{background:rgba(234,241,248,.25)}
  .back{appearance:none;background:transparent;border:0;color:var(--muted);cursor:pointer;
    font:600 10px/1 Manrope, sans-serif;letter-spacing:.12em;text-transform:uppercase;
    padding:14px 0 10px}
  .back:hover{color:var(--ink)}
  .badge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
    padding:6px 9px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:#B7C2D0;font-weight:600}
  .detail h2{margin:12px 0 0;font-size:clamp(22px,2.4vw,30px);line-height:1.05;
    letter-spacing:-.03em;font-weight:700}
  .detail .note{margin:8px 0 0;color:#94A3B4;font-size:13px;line-height:1.5}
  .photo{margin-top:16px;height:170px;position:relative}
  .cta{display:inline-block;margin-top:14px;border:2px solid var(--accent);color:var(--accent);
    font:600 11px/1 Manrope, sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:12px 14px}
  .cta:hover{background:var(--accent);color:#04120F}
  .kv{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;display:flex;gap:26px}
  .kv b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1}
  .kv i{display:block;font-style:normal;margin-top:6px;font-size:10px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--muted);font-weight:600}

  .toggle{grid-row:1;grid-column:2;justify-self:end;align-self:start;display:flex;
    pointer-events:auto;border:2px solid var(--rule);height:max-content}
  .toggle button{appearance:none;background:transparent;border:0;border-right:2px solid var(--rule);
    color:var(--ink);font:600 12px/1 Manrope, sans-serif;letter-spacing:.1em;text-transform:uppercase;
    padding:13px 18px;text-align:left;cursor:pointer;transition:background .18s,color .18s}
  .toggle button:last-child{border-right:0}
  .toggle button[aria-pressed="true"]{background:var(--accent);color:#04120F}
  .toggle button:hover[aria-pressed="false"]{background:rgba(46,211,198,.16)}
  .toggle button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* Strategy overlays. A separate control from the Globe/NI view switch above,
     because these answer a different question — that one is WHERE AM I
     LOOKING, this one is WHAT IS DRAWN ON IT — and each layer toggles on its
     own. The swatch carries the layer's own colour so the legend and the map
     cannot drift apart. */
  .layers{grid-row:1;grid-column:2;justify-self:end;align-self:start;margin-top:58px;
    display:flex;flex-direction:column;gap:6px;pointer-events:auto;align-items:flex-end}
  .layers button{appearance:none;background:rgba(11,18,32,.72);border:2px solid var(--rule);
    color:var(--ink);font:600 11px/1 Manrope, sans-serif;letter-spacing:.09em;text-transform:uppercase;
    padding:9px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;
    transition:background .18s,border-color .18s,opacity .18s;opacity:.55}
  .layers button[aria-pressed="true"]{opacity:1;border-color:var(--accent)}
  .layers button:hover{opacity:1}
  .layers button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .layers .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .layers .dot.sq{border-radius:1px}

  /* Marker readout. Sits above the canvas and is positioned per frame, because
     the globe spins — a tooltip placed once would slide off its own marker. */
  .tip{position:absolute;z-index:5;pointer-events:none;max-width:260px;
    background:rgba(8,14,26,.96);border:2px solid var(--rule);padding:10px 12px;
    transform:translate(-50%,calc(-100% - 14px));opacity:0;transition:opacity .12s}
  .tip[data-on="1"]{opacity:1}
  .tip b{display:block;font-size:13px;letter-spacing:-.01em}
  .tip .sub{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin-top:3px}
  .tip .stat{font-size:12px;line-height:1.4;color:#C7D3E2;margin-top:7px}
  .tip .tag{display:inline-block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;
    font-weight:700;padding:2px 6px;margin-top:7px;color:#04120F}

  .foot{grid-row:2;grid-column:1/-1;margin-top:18px}
  .rule{height:2px;background:var(--rule)}
  .footrow{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;
    flex-wrap:wrap;margin-top:14px}
  .stats{display:flex;gap:clamp(18px,2.6vw,44px);align-items:flex-end}
  .stat b{display:block;font-size:clamp(18px,2.1vw,30px);font-weight:700;letter-spacing:-.03em;line-height:1}
  .stat i{display:block;font-style:normal;margin-top:6px;font-size:10px;letter-spacing:.11em;
    text-transform:uppercase;color:var(--muted);font-weight:600}
  .credit{font-size:11px;color:#5D6B80;letter-spacing:.04em}
  @media (max-width:820px){
    .layer{grid-template-columns:1fr}
    .toggle{grid-row:2;grid-column:1;justify-self:start;margin-top:12px}
    .foot{grid-row:3}
    .side{max-height:52vh}
    .stats{gap:18px}
  }
</style>
</head>
<body data-mode="globe" data-searching="0">
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" data-bg-color="#0d1626">
    <rect width="400" height="400" fill="#0d1626"/>
    <circle cx="200" cy="200" r="110" fill="#16233a"/>
    <circle cx="200" cy="200" r="110" fill="none" stroke="#2ED3C6" stroke-width="3"/>
    <circle cx="228" cy="152" r="9" fill="#2ED3C6"/>
    <path d="M160 250h80" stroke="#EAF1F8" stroke-width="4"/>
  </svg>
</template>
<div id="stage">
  <canvas id="map"></canvas>
  <div class="tip" id="tip" role="status" aria-live="polite"></div>
  <div class="layer">
    <div class="side">
      <div class="brand"><span></span>ParkEasy</div>
      <div class="headline">
        <h1>Find parking <em>anywhere.</em></h1>
        <!-- TWO CLAIMS, KEPT APART ON PURPOSE. The search is worldwide: type any
             place on Earth and the globe flies to it. The COVERAGE is Ireland,
             and saying otherwise would be the kind of number a stranger can
             disprove in one tap. The tiles below count what is mapped; this
             line says where that is. -->
        <p class="lede">Search anywhere on Earth and the globe flies to it, with the nearest spaces listed. Ireland is mapped in detail — free bays, hidden gems, paid car parks and host sites, with the local businesses beside them.</p>
      </div>
      <div class="search">
        <input id="q" type="search" placeholder="Search a town, space or partner" autocomplete="off" aria-label="Search">
        <button id="clear" type="button" title="Clear">CLEAR</button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="results" id="results"></div>
      <div class="detail" id="detail" hidden></div>
    </div>
    <div class="toggle" role="group" aria-label="View">
      <button id="btn-globe" aria-pressed="true">Globe</button>
      <button id="btn-ni" aria-pressed="false">Northern Ireland</button>
    </div>
    <div class="layers" id="layers" role="group" aria-label="Map layers"></div>
    <div class="foot">
      <div class="rule"></div>
      <div class="footrow">
        <div class="stats">
          <!-- Replaced by paintStats() from the generated counts. Left empty
               rather than pre-filled: the shipped version had 741 / 88 / 25
               typed in, and all three were wrong. -->
        </div>
        <div class="credit">parkeasy.uk · Belfast</div>
      </div>
    </div>
  </div>
</div>

<script>
const BELFAST = [-5.9301, 54.5973];
const TYPES = {
  host:    { label: 'Host',       plural: 'Host car parks' },
  partner: { label: 'Partner',    plural: 'Local partners' },
  paid:    { label: 'Paid',       plural: 'Paid car parks' },
  free:    { label: 'Free',       plural: 'Free bays' },
  gem:     { label: 'Hidden gem', plural: 'Hidden gems' }
};
const filters = { host: true, partner: true, paid: true, free: true, gem: true };

/* ---------- strategy overlays ----------
   Two reference layers drawn over the world view, loaded from
   /globe/markets.json. Both are STATIC data the founder supplied, not a live
   feed and not measurements taken from ParkEasy — markets.json says so at the
   top and the tooltips label them, because a number on a map is read as a fact
   about the map.

   TIER COLOURS CARRY THE MEANING, so they are defined once here and the legend
   swatches are painted from the same table. Home is the accent the whole site
   already uses for ParkEasy itself; blue reads as "go"; amber as "contested".

   Operators are drawn as a BUILDING, deliberately not a pin. A pin on this map
   means a place you can park, and these are head offices — APCOA's Stuttgart
   HQ is not somewhere anybody parks. Different shape, different question. */
const TIERS = {
  home: { colour: '#2ED3C6', label: 'Home market' },
  1:    { colour: '#5B9DFF', label: 'Tier 1 — near-term' },
  2:    { colour: '#F5B544', label: 'Tier 2 — competitive' }
};
const OPERATOR_COLOUR = '#C2A8FF';
const tierOf = h => TIERS[h.tier] || TIERS[1];

const LAYERS = {
  hotspots:  { label: 'Target markets', shape: 'dot', colour: '#5B9DFF' },
  operators: { label: 'Operators',      shape: 'sq',  colour: OPERATOR_COLOUR }
};
const layerOn = { hotspots: true, operators: true };
let MARKETS = { hotspots: [], operators: [] };
// The marker the pointer is over, and the one clicked open. Pinning also stops
// the globe spinning — otherwise the thing being read rotates away mid-sentence.
let hovered = null, pinned = null;

const TOWNS = [
  { n: "Belfast", c: [-5.9301, 54.5973], rank: 0 },
  { n: "Derry~Londonderry", c: [-7.3186, 55.0068], rank: 0 },
  { n: "Lisburn", c: [-6.0580, 54.5162], rank: 1 },
  { n: "Newry", c: [-6.3402, 54.1751], rank: 1 },
  { n: "Bangor", c: [-5.6683, 54.6538], rank: 1 },
  { n: "Ballymena", c: [-6.2758, 54.8643], rank: 1 },
  { n: "Coleraine", c: [-6.6685, 55.1326], rank: 1 },
  { n: "Omagh", c: [-7.3097, 54.5977], rank: 1 },
  { n: "Newtownabbey", c: [-5.9480, 54.6790], rank: 2 },
  { n: "Carrickfergus", c: [-5.8060, 54.7150], rank: 2 },
  { n: "Antrim", c: [-6.2100, 54.7200], rank: 2 },
  { n: "Larne", c: [-5.8230, 54.8500], rank: 2 },
  { n: "Ballycastle", c: [-6.2450, 55.2030], rank: 2 },
  { n: "Portrush", c: [-6.6530, 55.2050], rank: 2 },
  { n: "Strabane", c: [-7.4640, 54.8270], rank: 2 },
  { n: "Magherafelt", c: [-6.6070, 54.7550], rank: 2 },
  { n: "Cookstown", c: [-6.7450, 54.6420], rank: 2 },
  { n: "Dungannon", c: [-6.7660, 54.5090], rank: 2 },
  { n: "Enniskillen", c: [-7.6316, 54.3438], rank: 2 },
  { n: "Armagh", c: [-6.6528, 54.3503], rank: 2 },
  { n: "Portadown", c: [-6.4500, 54.4200], rank: 2, dy: 10 },
  { n: "Craigavon", c: [-6.3870, 54.4470], rank: 2, dy: -10 },
  { n: "Banbridge", c: [-6.2700, 54.3490], rank: 2 },
  { n: "Downpatrick", c: [-5.7169, 54.3287], rank: 2 },
  { n: "Newcastle", c: [-5.8890, 54.2170], rank: 2 }
];
let townByName = Object.fromEntries(TOWNS.map(t => [t.n, t]));

/**
 * Fold any town that has spots but no entry above into TOWNS.
 *
 * The list started as 25 hand-placed Northern Ireland towns with tuned label
 * offsets. The data has since outgrown it — the Gem Scout run alone added
 * seventeen — and a town missing from here is a town the search box cannot
 * find and the map will not label, however many spaces sit in it.
 *
 * Derived entries get rank 2, the lowest, so they never outrank a hand-placed
 * label, and their centre is the mean of their own spots: it is where the
 * parking is, and it avoids inventing a town centre nobody checked. Called
 * after places.json loads, because that is the first moment the full list of
 * towns exists.
 *
 * ARCS is deliberately NOT rebuilt. Those arcs run from each town to Belfast
 * and read as the Northern Ireland network; drawing one from Achill would say
 * something about this business that is not true yet.
 */
function foldInDataTowns(places) {
  const seen = new Set(TOWNS.map(t => t.n));
  const acc = {};
  for (const p of places) {
    if (!p.town || seen.has(p.town)) continue;
    const a = acc[p.town] || (acc[p.town] = { lng: 0, lat: 0, n: 0 });
    a.lng += p.c[0]; a.lat += p.c[1]; a.n++;
  }
  for (const [n, a] of Object.entries(acc)) {
    TOWNS.push({ n, c: [a.lng / a.n, a.lat / a.n], rank: 2, derived: true });
  }
  townByName = Object.fromEntries(TOWNS.map(t => [t.n, t]));
}

const ARCS = TOWNS.filter(t => t.n !== "Belfast").map(t => {
  const inter = d3.geoInterpolate(t.c, BELFAST);
  const pts = d3.range(0, 1.0001, 0.02).map(inter);
  return { pts, full: { type: 'LineString', coordinates: pts } };
});

const cv = document.getElementById('map');
const ctx = cv.getContext('2d');
const projection = d3.geoOrthographic().clipAngle(90).precision(0.3);
const path = d3.geoPath(projection, ctx);
const graticule = d3.geoGraticule10();

let W = 0, H = 0, DPR = 1;
let land = null, ni = null, ireland = null;
let PLACES = [], AREAS = {};
let mode = 'globe', city = null, selected = null;
let spin = -8;
let view = { lambda: 8, phi: -18, scale: 249.5, tx: 0, ty: 0 };
let tween = null, cityBase = null, cityT0 = 0;
let niFit = null, globeFit = null, cityScale = 1, placeScale = 1;
let t0 = performance.now();

const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
// markets.json is static and hand-written, but it still reaches innerHTML, and
// "escape it because it is data" is the rule that survives somebody later
// pointing this at a feed.
const esc = s => String(s == null ? '' : s)
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;');
const clamp01 = v => Math.max(0, Math.min(1, v));

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 1.5);
  W = cv.clientWidth; H = cv.clientHeight;
  cv.width = W * DPR; cv.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  computeFits();
  // The target for 'place' mode is the place, not its town — and cityBase has
  // to be rebuilt too, or the flyover keeps drifting around where the old
  // viewport's centre used to be.
  if (!tween) {
    view = cameraFor(mode, mode === 'place' ? selected : city);
    if (mode === 'city' || mode === 'place') { cityBase = { ...view }; cityT0 = performance.now(); }
  }
}

function mapLeft() {
  if (W <= 820) return 0;
  const side = document.querySelector('.side');
  return side ? side.getBoundingClientRect().right + 18 : 0;
}

// On a phone the sidebar is stacked ON TOP of a full-bleed canvas, so the top
// of the screen is not map — anything drawn there lands on the search box and
// the panel. computeFits already aims the camera at H*0.66 for that reason;
// labels need to respect the same edge.
function mapTop() { return W > 820 ? 0 : H * 0.40; }

// Where a label is allowed to sit. Without this the close-up printed names
// straight off both sides of the canvas — on a 414px screen "WELLINGTON PLACE
// ON-STR…" was cut off mid-word, which is worse than not naming it.
function labelBounds() {
  return { x0: mapLeft() + 6, x1: W - 6, y0: mapTop() + 6, y1: H - 6 };
}

function computeFits() {
  const wide = W > 820;
  const ml = mapLeft();
  globeFit = {
    translate: [ml + (W - ml) / 2, wide ? H * 0.5 : H * 0.66],
    scale: Math.min(W - ml, H) * (wide ? 0.42 : 0.32)
  };
  if (ni) {
    const l = wide ? ml + 12 : W * 0.08, t = wide ? H * 0.10 : H * 0.42;
    const p = d3.geoOrthographic().clipAngle(90).rotate([-BELFAST[0], -BELFAST[1]]);
    p.fitExtent([[l, t], [W - W * 0.06, H - H * 0.18]], ni);
    niFit = { translate: p.translate(), scale: p.scale() };
  }
  cityScale = (Math.min(W, H) * 0.78) / (30 / 6371);
  // A single space needs a frame measured in streets, not in towns. 30km wide
  // is the right view of Belfast and the wrong view of Wellington Place: at
  // that scale every space in the city centre lands within a few pixels of
  // every other, so selecting one moved the camera nowhere and showed nothing
  // new. 2.5km is close enough to see which street it is on.
  placeScale = (Math.min(W, H) * 0.78) / (2.5 / 6371);
}

// Distance rings, chosen to fit the frame rather than fixed at 2/5/10km.
// At street level a 2km ring is most of the screen and the 10km one is off it,
// so the rings said nothing about the space in the middle.
const RING_LADDER = [0.1, 0.25, 0.5, 1, 2, 5, 10, 25, 50, 100];
function ringsFor(kmPx, maxPx) {
  return RING_LADDER.filter(km => {
    const r = km * kmPx;
    return r > 26 && r < maxPx;
  }).slice(0, 3);
}
const ringLabel = km => (km < 1 ? Math.round(km * 1000) + ' M' : km + ' KM');

function cameraFor(m, target) {
  const wide = W > 820, ml = mapLeft();
  if (m === 'place' && target) {
    return { lambda: -target.c[0], phi: -target.c[1], scale: placeScale,
      tx: ml + (W - ml) * 0.48, ty: wide ? H * 0.5 : H * 0.66 };
  }
  if (m === 'city' && target) {
    return { lambda: -target.c[0], phi: -target.c[1], scale: cityScale,
      tx: ml + (W - ml) * 0.48, ty: wide ? H * 0.5 : H * 0.66 };
  }
  if (m === 'ni' && niFit) {
    return { lambda: -BELFAST[0], phi: -BELFAST[1], scale: niFit.scale,
      tx: niFit.translate[0], ty: niFit.translate[1] };
  }
  return { lambda: spin, phi: -18, scale: globeFit.scale,
    tx: globeFit.translate[0], ty: globeFit.translate[1] };
}

function goTo(m, target) {
  mode = m;
  // 'place' keeps the town as context — closeUp still labels the areas around
  // it — but the camera and the rings belong to the space itself.
  if (m === 'city') { city = target; selected = null; }
  else if (m === 'place') { city = townByName[target.town] || city || TOWNS[0]; selected = target; }
  else { city = null; selected = null; }
  // The stylesheet only ever asks whether this is the globe, so 'place' behaves
  // like 'city' in the sidebar without a rule of its own.
  document.body.dataset.mode = m;
  document.getElementById('btn-globe').setAttribute('aria-pressed', String(m === 'globe'));
  document.getElementById('btn-ni').setAttribute('aria-pressed', String(m !== 'globe'));
  const to = cameraFor(m, target);
  const close = m === 'city' || m === 'place';
  if (close) { cityBase = { ...to }; cityT0 = performance.now() + 1800; }
  tween = { from: { ...view }, to, start: performance.now(),
            dur: m === 'place' ? 1500 : m === 'city' ? 1800 : 1400, dive: close };
  schedule();
}

/* ---------- sidebar ---------- */

function buildFilters() {
  const wrap = document.getElementById('filters');
  wrap.innerHTML = Object.keys(TYPES).map(k =>
    '<button data-t="' + k + '" aria-pressed="true"><i class="sw-' + k + '"></i>' + TYPES[k].label + '</button>').join('');
  wrap.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.t;
    filters[k] = !filters[k];
    b.setAttribute('aria-pressed', String(filters[k]));
    renderList();
  });
}

function matches(q) {
  const towns = TOWNS.filter(t => t.n.toLowerCase().includes(q));
  const places = PLACES.filter(p => filters[p.t] &&
    (p.n.toLowerCase().includes(q) || p.town.toLowerCase().includes(q)));
  return { towns, places };
}

/* ---------- anywhere on Earth ----------
   A driver does not think in our town list. They think "Aspire Lounge" or
   "Cromore Road", and until now a search we did not recognise returned
   "Nothing matches that" — which is how the admin dashboard ended up with a
   list of real places people wanted and could not find.

   So an unrecognised search is geocoded and the globe flies there, with the
   nearest mapped spaces listed by distance. Where we have nothing yet, the
   honest answer is "nothing within Xkm" at the right place on the map, not a
   dead end.

   Nominatim, because it is free, keyless and already allowed by the site CSP.
   Its usage policy asks for no more than one request a second, which is why
   this only fires on an explicit Enter or button press — never per keystroke. */
const geoCache = new Map();
let geoBusy = false;

async function geocode(q) {
  const key = q.toLowerCase().trim();
  if (geoCache.has(key)) return geoCache.get(key);
  const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q='
    + encodeURIComponent(q);
  const r = await fetch(url, { headers: { Accept: 'application/json' } });
  if (!r.ok) throw new Error('geocode ' + r.status);
  const j = await r.json();
  const hit = Array.isArray(j) && j[0] ? {
    n: String(j[0].display_name || q).split(',').slice(0, 2).join(',').trim(),
    c: [Number(j[0].lon), Number(j[0].lat)],
  } : null;
  // A miss is cached too, or a typo costs a request every time it is retried.
  geoCache.set(key, hit);
  return hit;
}

const R_EARTH = 6371;
function kmBetween(a, b) {
  const rad = Math.PI / 180;
  const dLat = (b[1] - a[1]) * rad, dLng = (b[0] - a[0]) * rad;
  const s = Math.sin(dLat / 2) ** 2
    + Math.cos(a[1] * rad) * Math.cos(b[1] * rad) * Math.sin(dLng / 2) ** 2;
  return 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(s)));
}

/**
 * The mapped spaces closest to a point, nearest first — and only ones a driver
 * could actually use.
 *
 * NEAREST_KM IS THE WHOLE POINT. Without a radius this returns the globally
 * nearest spaces, which for a search in Tokyo meant a car park in Perth, 7,920
 * km away, listed as a result. Every row was true and the answer was a lie:
 * it implies coverage where there is none, which is the same overstatement as
 * a wrong restriction, just wearing a distance column.
 *
 * 25 km is about as far as anyone drives to park and then walk. Beyond it the
 * honest answer is that we have nothing there, and renderList says so.
 */
const NEAREST_KM = 25;
function nearestTo(c, limit = 40, maxKm = NEAREST_KM) {
  return PLACES.filter(p => filters[p.t])
    .map(p => ({ p, km: kmBetween(c, p.c) }))
    .filter(x => x.km <= maxKm)
    .sort((x, y) => x.km - y.km)
    .slice(0, limit);
}

async function goAnywhere(q) {
  if (!q || geoBusy) return;
  const el = document.getElementById('results');
  geoBusy = true;
  el.innerHTML = '<div class="empty">Looking for “' + esc(q) + '”…</div>';
  el.hidden = false;
  try {
    const hit = await geocode(q);
    if (!hit || !Number.isFinite(hit.c[0]) || !Number.isFinite(hit.c[1])) {
      el.innerHTML = '<div class="empty">Could not find “' + esc(q) + '” anywhere. '
        + 'Try a town, a postcode, or a landmark.</div>';
      return;
    }
    // adhoc marks a place that is not one of our towns, so the list shows the
    // nearest spaces by distance rather than filtering on a town name that
    // matches nothing.
    selected = null;
    goTo('city', { ...hit, adhoc: true });
    document.getElementById('q').value = '';
    renderList();
  } catch {
    el.innerHTML = '<div class="empty">Could not reach the place lookup just now. '
      + 'Check your connection and try again.</div>';
  } finally {
    geoBusy = false;
  }
}

function renderList() {
  const q = document.getElementById('q').value.trim().toLowerCase();
  const el = document.getElementById('results');
  document.body.dataset.searching = q ? '1' : '0';
  let towns, places;
  if (q) {
    ({ towns, places } = matches(q));
    places = places.sort(byPartnerFirst).slice(0, 60);
  } else if (mode === 'city' && city && city.adhoc) {
    // Somewhere the driver searched for that is not one of our towns. There is
    // no town name to filter on, so the list is what is actually near them.
    towns = [];
    const near = nearestTo(city.c);
    places = near.map(({ p, km }) => ({ ...p, _km: km }));
  } else if (mode === 'city' && city) {
    towns = [];
    // Partners in this town lead it. Everything else keeps its place — the
    // list is reordered, never trimmed.
    places = PLACES.filter(p => p.town === city.n && filters[p.t]).sort(byPartnerFirst);
  } else {
    towns = TOWNS;
    places = PLACES.filter(p => (p.t === 'host' || p.t === 'partner') && filters[p.t]).sort(byPartnerFirst);
  }
  let html = '';
  if (towns.length) {
    html += '<div class="grp">Towns</div>' + towns.map(t =>
      '<button class="row" data-town="' + t.n + '"><i style="background:rgba(234,241,248,.7)"></i>' +
      t.n + '<s>' + countIn(t.n) + ' spaces</s></button>').join('');
  }
  if (places.length) {
    const byType = {};
    places.forEach(p => (byType[p.t] = byType[p.t] || []).push(p));
    Object.keys(TYPES).filter(k => byType[k]).forEach(k => {
      html += '<div class="grp">' + TYPES[k].plural + '</div>' + byType[k].map(p => {
        // The right-hand caption is the ARGUMENT, not decoration. For a
        // partner it answers the only question a driver on a parking map has
        // about a business — can I park there — with a counted number rather
        // than an adjective.
        let s = p.town;
        // How far, when the driver searched a point rather than picked a town.
        // Distance is the only thing they actually asked about.
        if (typeof p._km === 'number') {
          s = (p._km < 1 ? Math.round(p._km * 1000) + ' m' : p._km.toFixed(1) + ' km')
            + ' · ' + p.town;
        } else if ((p.t === 'partner' || p.t === 'host') && p.nearby > 0) {
          s = p.nearby + ' space' + (p.nearby === 1 ? '' : 's') + ' · ' + p.walkMin + ' min walk';
        } else if (p.online) {
          s = 'Online';
        }
        return '<button class="row' + (p.t === 'partner' ? ' is-partner' : '') + '" data-id="' + p.id + '">' +
          '<i class="sw-' + k + '"></i>' + p.n + '<s>' + s + '</s></button>';
      }).join('');
    });
  }
  // A search that matches nothing we hold is not a dead end any more: it is
  // offered to the geocoder, which is the whole point of the worldwide search.
  // The button is explicit rather than automatic so the lookup fires once, on
  // intent, and stays inside Nominatim's one-request-a-second policy.
  if (!html && q) {
    const raw = document.getElementById('q').value.trim();
    html = '<div class="empty">Nothing mapped under that name.<br><br>'
      + '<button class="row go" data-go="1"><i style="background:var(--accent)"></i>'
      + 'Search the world for “' + esc(raw) + '”<s>fly there</s></button></div>';
  } else if (!html) {
    html = '<div class="empty">Search any town, space, partner — or anywhere on Earth.</div>';
  }
  // A named town with nothing in it yet still deserves the honest answer.
  if (mode === 'city' && city && city.adhoc && !places.length) {
    html = '<div class="empty">Nothing mapped within ' + NEAREST_KM + ' km of '
      + esc(city.n) + ' yet.<br>The globe has moved there — the spaces have not '
      + 'been added.</div>';
  }
  el.innerHTML = html;
  el.hidden = false;
  document.getElementById('detail').hidden = true;
  el.querySelectorAll('[data-town]').forEach(b => b.onclick = () => selectTown(townByName[b.dataset.town]));
  el.querySelectorAll('[data-id]').forEach(b => b.onclick = () => selectPlace(PLACES.find(p => p.id === b.dataset.id)));
  el.querySelectorAll('[data-go]').forEach(b => b.onclick =
    () => goAnywhere(document.getElementById('q').value.trim()));
}

function countIn(town) { return PLACES.filter(p => p.town === town).length; }

function selectTown(t) {
  selected = null;
  goTo('city', t);
  document.getElementById('q').value = '';
  renderList();
}

function selectPlace(p) {
  if (!p) return;
  // goTo('city', town) was the bug Marty photographed: picking Wellington Place
  // and picking Cave Hill produced the same camera, and picking anything at all
  // while already in Belfast produced no movement whatsoever.
  goTo('place', p);
  renderDetail(p);
}

// What to say about partners on a given place's panel.
//   a partner  -> the parking around its door, counted
//   a space    -> the partners within a short walk of it
// Empty string when there is nothing true to say, rather than a filler line.
function partnerBlock(p) {
  if (p.t === 'partner' || p.t === 'host') {
    if (!p.nearby) return '';
    return '<div class="kv"><div><b>' + p.nearby + '</b><i>Spaces within 500m</i></div>' +
      '<div><b>' + p.walkMin + ' min</b><i>To the nearest one</i></div></div>';
  }
  if (!Number.isFinite(p.c?.[0])) return '';
  const near = PLACES
    .filter(x => x.t === 'partner' && x.pinnable && metres(x.c, p.c) < 900)
    .map(x => ({ x, d: metres(x.c, p.c) }))
    .sort((a, b) => a.d - b.d)
    .slice(0, 3);
  if (!near.length) return '';
  return '<div class="grp">Partners a short walk away</div>' +
    near.map(({ x, d }) =>
      '<button class="row is-partner" data-goto="' + x.id + '"><i class="sw-partner"></i>' +
      x.n + '<s>' + Math.max(1, Math.round(d / WALK_M_PER_MIN)) + ' min walk</s></button>').join('');
}

function renderDetail(p) {
  const el = document.getElementById('detail');
  const isPartner = p.t === 'partner';
  el.innerHTML =
    '<button class="back" id="d-back">← All spaces</button>' +
    '<div><span class="badge"><i class="sw-' + p.t + '" style="width:9px;height:9px;display:block"></i>' +
      TYPES[p.t].label + '</span></div>' +
    '<h2>' + p.n + '</h2>' +
    '<p class="note">' + (p.note || (isPartner ? 'Listed in the ParkEasy partner directory.' : p.town)) + '</p>' +
    '<div class="photo"><image-slot id="ph-' + slug(p.n) + '" shape="rect" fit="cover" placeholder="Drop a photo of ' + p.n + '"></image-slot></div>' +
    (isPartner ? '<a class="cta" href="https://parkeasy.uk/" target="_blank" rel="noopener">View on parkeasy.uk →</a>' : '') +
    // ── THE FUNNEL, BOTH WAYS ────────────────────────────────────────────
    // Open a PARTNER and it answers "can I park there" with a count off the
    // real data. Open a SPACE and it names the partners you could walk to
    // from it — which is the moment that actually moves somebody, because
    // they have already decided where to leave the car and are now deciding
    // what to do next.
    //
    // Labelled "Partners", never slipped in as if it were part of the space.
    // An advert a driver can see is an advert; one they cannot is a trick,
    // and this product runs on people trusting what it tells them.
    partnerBlock(p) +
    '<div class="kv"><div><b>' + p.town + '</b><i>Town</i></div><div><b>' +
      p.c[1].toFixed(3) + ', ' + p.c[0].toFixed(3) + '</b><i>Position</i></div></div>';
  el.hidden = false;
  document.getElementById('results').hidden = true;
  el.querySelectorAll('[data-goto]').forEach(b =>
    b.onclick = () => selectPlace(PLACES.find(x => x.id === b.dataset.goto)));
  // Back out of the camera as well as out of the panel. Without this the list
  // says "all spaces" while the map is still parked two streets from the one
  // just closed.
  document.getElementById('d-back').onclick = () => {
    const t = city;
    if (t) goTo('city', t); else selected = null;   // goTo clears the selection itself
    renderList();
  };
}

document.getElementById('q').addEventListener('input', renderList);
document.getElementById('q').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const q = e.target.value.trim().toLowerCase();
  if (!q) return;
  const { towns, places } = matches(q);
  if (towns.length) selectTown(towns[0]);
  else if (places.length) selectPlace(places[0]);
  // What we hold comes first — a driver typing "Belfast" wants our Belfast,
  // not a geocoder's. Enter on something we do not hold is the intent the
  // worldwide lookup waits for.
  else goAnywhere(e.target.value.trim());
});
document.getElementById('clear').onclick = () => {
  document.getElementById('q').value = '';
  renderList();
};
document.getElementById('btn-globe').onclick = () => { if (mode !== 'globe') goTo('globe'); renderList(); };
document.getElementById('btn-ni').onclick = () => { if (mode !== 'ni') goTo('ni'); renderList(); };
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && mode === 'city') { goTo('ni'); renderList(); }
});

/* ---------- interaction on the map ---------- */

/* The overlay markers, hit-tested separately from the parking ones. They are
   the only thing clickable in globe mode, where hitAt() below bails out. */
function marketAt(x, y) {
  let best = null, bd = 18;
  marketPoints().forEach(m => {
    if (!facing(m.c)) return;
    const q = projection(m.c);
    const d = Math.hypot(q[0] - x, q[1] - y);
    if (d < bd) { bd = d; best = m; }
  });
  return best;
}

function hitAt(x, y) {
  if (mode === 'globe' || !land) return null;
  let best = null, bd = 22;
  if (mode === 'city') {
    PLACES.forEach(p => {
      if (!filters[p.t]) return;
      const q = projection(p.c);
      const d = Math.hypot(q[0] - x, q[1] - y);
      if (d < bd) { bd = d; best = { kind: 'place', ref: p }; }
    });
    if (best) return best;
  }
  bd = 24;
  TOWNS.forEach(t => {
    const q = projection(t.c);
    const d = Math.hypot(q[0] - x, q[1] - y);
    if (d < bd) { bd = d; best = { kind: 'town', ref: t }; }
  });
  return best;
}

cv.addEventListener('mousemove', e => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const m = marketAt(x, y);
  // Hovering a different marker replaces what the tooltip says; a pinned one
  // stays put until it is dismissed, so a click does not evaporate on the way
  // to reading it.
  if ((m && m.ref) !== (hovered && hovered.ref)) {
    hovered = m;
    if (!pinned) setTip(m);
    schedule();
  }
  cv.style.cursor = (m || hitAt(x, y)) ? 'pointer' : 'default';
});
cv.addEventListener('mouseleave', () => {
  hovered = null;
  if (!pinned) setTip(null);
});
cv.addEventListener('click', e => {
  const r = cv.getBoundingClientRect();
  const x = e.clientX - r.left, y = e.clientY - r.top;
  const m = marketAt(x, y);
  if (m) {
    // Clicking the open one closes it, which is the only way back to a
    // spinning globe once something is pinned.
    pinned = (pinned && pinned.ref === m.ref) ? null : m;
    setTip(pinned || hovered);
    schedule();
    return;
  }
  if (pinned) { pinned = null; setTip(hovered); }
  const h = hitAt(x, y);
  if (!h) return;
  if (h.kind === 'place') selectPlace(h.ref);
  else selectTown(h.ref);
});

/* ---------- loop ---------- */

function frame(now) {
  const dt = Math.min(now - t0, 60); t0 = now;
  if (tween) {
    const k = Math.min(1, (now - tween.start) / tween.dur);
    const e = k < 0.5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
    const a = tween.from, b = tween.to;
    let dl = b.lambda - a.lambda;
    while (dl > 180) dl -= 360; while (dl < -180) dl += 360;
    const dive = tween.dive ? 1 + 0.10 * Math.sin(Math.PI * e) : 1;
    view = {
      lambda: a.lambda + dl * e,
      phi: a.phi + (b.phi - a.phi) * e,
      scale: a.scale * Math.pow(b.scale / a.scale, e) * dive,
      tx: a.tx + (b.tx - a.tx) * e,
      ty: a.ty + (b.ty - a.ty) * e
    };
    if (k === 1) { tween = null; if (mode === 'globe') spin = view.lambda; }
  } else if (mode === 'globe') {
    // Held still while a marker is open. The globe rotating would carry the
    // thing being read off the edge of the world mid-sentence.
    if (!pinned) spin += dt * 0.0055;
    view = cameraFor('globe');
  } else if ((mode === 'city' || mode === 'place') && cityBase && city) {
    // slow flyover: the camera circles and breathes, never quite settling.
    //
    // Scaled to the frame. The town wobble is about a kilometre of longitude,
    // which is 3% of a 30km view and a third of a 2.5km one — at street level
    // the same numbers swing the space in and out of shot. amp keeps the
    // movement the same FRACTION of the frame at either distance.
    const amp = mode === 'place' ? 0.09 : 1;
    const s = (now - cityT0) / 1000;
    const lonScale = 1 / Math.max(0.2, Math.cos(city.c[1] * Math.PI / 180));
    view = {
      lambda: cityBase.lambda + Math.cos(s * 0.14) * 0.009 * lonScale * amp,
      phi: cityBase.phi + Math.sin(s * 0.14) * 0.006 * amp,
      scale: cityBase.scale * (1 + 0.045 * amp * Math.sin(s * 0.10) + Math.min(0.10, s * 0.0016) * amp),
      tx: cityBase.tx + Math.sin(s * 0.09) * 6 * amp,
      ty: cityBase.ty + Math.cos(s * 0.11) * 4 * amp
    };
  }
  projection.rotate([view.lambda, view.phi, 0]).scale(view.scale).translate([view.tx, view.ty]);
  draw(now);
  paintTip();
  lastFrame = now;
  schedule();
}

let lastFrame = 0, rafId = 0, timerId = 0;
function schedule() {
  cancelAnimationFrame(rafId); clearTimeout(timerId);
  rafId = requestAnimationFrame(frame);
  timerId = setTimeout(() => {
    if (performance.now() - lastFrame > 90) frame(performance.now());
    else schedule();
  }, 100);
}

/* ---------- drawing ---------- */

function draw(now) {
  ctx.clearRect(0, 0, W, H);
  if (!land) return;
  // keep the map out from under the sidebar
  const clipLeft = mapLeft();
  ctx.save();
  ctx.beginPath(); ctx.rect(clipLeft, 0, W - clipLeft, H); ctx.clip();
  const c = [view.tx, view.ty], r = view.scale;
  const zoom = clamp01(Math.log(r / globeFit.scale) / Math.log(niFit.scale / globeFit.scale));
  const cz = clamp01(Math.log(r / niFit.scale) / Math.log(cityScale / niFit.scale));

  const g = ctx.createRadialGradient(c[0] - r * .35, c[1] - r * .45, r * .1, c[0], c[1], r * 1.05);
  g.addColorStop(0, '#16233a'); g.addColorStop(1, '#0B1220');
  ctx.beginPath(); path({ type: 'Sphere' }); ctx.fillStyle = g; ctx.fill();

  ctx.beginPath(); path(graticule);
  ctx.strokeStyle = 'rgba(234,241,248,' + (0.07 - 0.05 * zoom) + ')'; ctx.lineWidth = 1; ctx.stroke();

  ctx.beginPath(); path(land);
  ctx.fillStyle = '#1B2739'; ctx.fill();
  ctx.strokeStyle = 'rgba(234,241,248,.20)'; ctx.lineWidth = 1; ctx.stroke();

  if (ireland) { ctx.beginPath(); path(ireland); ctx.fillStyle = '#22334A'; ctx.fill(); }
  if (ni) {
    const fade = 1 - cz;
    ctx.save();
    if (cz > 0.02) {
      ctx.beginPath(); path(ni);
      ctx.fillStyle = 'rgba(35,54,77,' + cz.toFixed(2) + ')'; ctx.fill();
    }
    ctx.beginPath(); path(ni);
    ctx.fillStyle = zoom > 0.02 ? 'rgba(46,211,198,' + (0.045 + 0.085 * fade).toFixed(3) + ')' : 'rgba(46,211,198,.55)';
    ctx.shadowColor = 'rgba(46,211,198,.45)'; ctx.shadowBlur = (26 * zoom + 6) * fade;
    ctx.fill();
    ctx.strokeStyle = 'rgba(46,211,198,' + (0.3 + 0.7 * fade).toFixed(2) + ')';
    ctx.lineWidth = zoom > 0.02 ? 1.6 : 1.2; ctx.stroke();
    ctx.restore();
  }

  ctx.beginPath(); path({ type: 'Sphere' });
  ctx.strokeStyle = 'rgba(46,211,198,' + (0.55 - 0.5 * zoom) + ')'; ctx.lineWidth = 2; ctx.stroke();

  // The world layers belong to the world view: they fade out as the camera
  // dives into Northern Ireland, where a marker on Sydney means nothing and a
  // building icon over Lisburn would be mistaken for a car park.
  if (zoom < 0.55) drawMarkets(now, 1 - zoom / 0.55);
  if (zoom < 0.35) beacon(now, 1 - zoom / 0.35);
  if (zoom > 0.25 && cz < 0.85) regional(now, clamp01((zoom - 0.25) / 0.75) * (1 - cz / 0.85));
  if (cz > 0.2) closeUp(now, clamp01((cz - 0.2) / 0.8));
  ctx.restore();
  if (clipLeft > 0) { // the clip edge reads as a deliberate rule, not a seam
    ctx.beginPath(); ctx.moveTo(clipLeft - 9, 0); ctx.lineTo(clipLeft - 9, H);
    ctx.strokeStyle = 'rgba(234,241,248,.9)'; ctx.lineWidth = 2; ctx.stroke();
  }
}

function beacon(now, a) {
  const rot = projection.rotate();
  if (d3.geoDistance(BELFAST, [-rot[0], -rot[1]]) > Math.PI / 2 - 0.02) return;
  const p = projection(BELFAST);
  const k = (now % 2600) / 2600;
  ctx.save(); ctx.globalAlpha = a;
  ctx.beginPath(); ctx.arc(p[0], p[1], 6 + k * 46, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(46,211,198,' + (0.6 * (1 - k)) + ')'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.arc(p[0], p[1], 4.5, 0, Math.PI * 2);
  ctx.fillStyle = '#2ED3C6'; ctx.fill();
  ctx.font = '600 12px Manrope, sans-serif'; ctx.fillStyle = '#EAF1F8';
  ctx.fillText('BELFAST', p[0] + 14, p[1] + 4);
  ctx.restore();
}

/* Is this lon/lat on the side of the globe facing us? d3's orthographic
   projection happily returns coordinates for points round the back, which would
   paint Sydney on top of Spain. Same guard beacon() uses. */
function facing(c) {
  const rot = projection.rotate();
  return d3.geoDistance(c, [-rot[0], -rot[1]]) < Math.PI / 2 - 0.02;
}

const marketPoints = () => {
  const out = [];
  if (layerOn.hotspots) MARKETS.hotspots.forEach(h =>
    out.push({ kind: 'hotspot', layer: 'hotspots', ref: h, c: [h.lng, h.lat] }));
  if (layerOn.operators) MARKETS.operators.forEach(o =>
    out.push({ kind: 'operator', layer: 'operators', ref: o, c: [o.lng, o.lat] }));
  return out;
};

function drawMarkets(now, a) {
  const pts = marketPoints();
  if (!pts.length) return;
  ctx.save();
  ctx.globalAlpha = a;
  pts.forEach(m => {
    if (!facing(m.c)) return;
    const q = projection(m.c);
    const live = (pinned && pinned.ref === m.ref) || (hovered && hovered.ref === m.ref);
    if (m.kind === 'hotspot') {
      const col = tierOf(m.ref).colour;
      // The home market keeps a pulse: it is the one that actually exists.
      if (m.ref.tier === 'home') {
        const k = (now % 2600) / 2600;
        ctx.beginPath(); ctx.arc(q[0], q[1], 5 + k * 34, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(46,211,198,' + (0.55 * (1 - k)).toFixed(3) + ')';
        ctx.lineWidth = 2; ctx.stroke();
      }
      ctx.beginPath(); ctx.arc(q[0], q[1], live ? 7 : 5, 0, Math.PI * 2);
      ctx.fillStyle = col; ctx.fill();
      ctx.strokeStyle = 'rgba(4,18,15,.85)'; ctx.lineWidth = 1.5; ctx.stroke();
    } else {
      // A little building: base block plus two window rows. Reads as premises
      // at 14px, which is all it has to do.
      const w = live ? 13 : 11, h = live ? 13 : 11;
      ctx.save(); ctx.translate(q[0], q[1]);
      ctx.fillStyle = OPERATOR_COLOUR;
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.fillStyle = 'rgba(8,14,26,.9)';
      const u = w / 5;
      ctx.fillRect(-u * 1.5, -u * 1.2, u, u);
      ctx.fillRect(u * 0.5, -u * 1.2, u, u);
      ctx.fillRect(-u * 1.5, u * 0.3, u, u);
      ctx.fillRect(u * 0.5, u * 0.3, u, u);
      ctx.restore();
    }
  });
  ctx.restore();
}

/* The tooltip is DOM, not canvas, so it stays selectable and readable by a
   screen reader. Positioned every frame against the live projection. */
function paintTip() {
  const el = document.getElementById('tip');
  const m = pinned || hovered;
  if (!m || !facing(m.c)) { el.dataset.on = '0'; return; }
  const q = projection(m.c);
  el.style.left = q[0] + 'px';
  el.style.top = q[1] + 'px';
  el.dataset.on = '1';
}

function tipHTML(m) {
  if (m.kind === 'hotspot') {
    const h = m.ref, t = tierOf(h);
    return '<b>' + esc(h.city) + '</b>'
      + '<div class="sub">' + esc(h.country) + '</div>'
      + '<div class="stat">' + esc(h.stat) + '</div>'
      + '<span class="tag" style="background:' + t.colour + '">' + esc(t.label) + '</span>';
  }
  const o = m.ref;
  return '<b>' + esc(o.operator) + '</b>'
    + '<div class="sub">HQ · ' + esc(o.hq_city) + ', ' + esc(o.hq_country) + '</div>'
    + '<div class="stat">Operates in ' + o.countries_active
    + ' countr' + (o.countries_active === 1 ? 'y' : 'ies')
    + (o.notes ? '. ' + esc(o.notes) : '') + '</div>'
    + '<span class="tag" style="background:' + OPERATOR_COLOUR + '">Head office</span>';
}

function setTip(m) {
  const el = document.getElementById('tip');
  if (m) el.innerHTML = tipHTML(m);
  paintTip();
}

function buildLayerToggles() {
  const wrap = document.getElementById('layers');
  wrap.innerHTML = Object.keys(LAYERS).map(k => {
    const l = LAYERS[k];
    return '<button data-l="' + k + '" aria-pressed="' + layerOn[k] + '">'
      + '<i class="dot ' + (l.shape === 'sq' ? 'sq' : '') + '" style="background:' + l.colour + '"></i>'
      + l.label + '</button>';
  }).join('');
  wrap.querySelectorAll('button').forEach(b => b.onclick = () => {
    const k = b.dataset.l;
    layerOn[k] = !layerOn[k];
    b.setAttribute('aria-pressed', String(layerOn[k]));
    // Anything open in a layer just switched off must close with it.
    if (!layerOn[k]) {
      if (pinned && pinned.layer === k) pinned = null;
      if (hovered && hovered.layer === k) hovered = null;
      setTip(null);
    }
    schedule();
  });
}

function marker(p, type, now, big) {
  const s = big ? 1.35 : 1;
  if (type === 'host' || type === 'partner') {
    const k = ((now % 2200) / 2200 + (p[0] % 7) / 7) % 1;
    ctx.beginPath(); ctx.arc(p[0], p[1], (5 + k * 24) * s, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(46,211,198,' + (0.4 * (1 - k)) + ')'; ctx.lineWidth = 1.4; ctx.stroke();
  }
  if (type === 'partner') {
    const r = 6 * s;
    ctx.save(); ctx.translate(p[0], p[1]); ctx.rotate(Math.PI / 4);
    ctx.fillStyle = '#2ED3C6'; ctx.fillRect(-r, -r, r * 2, r * 2);
    ctx.fillStyle = '#0d1626'; ctx.fillRect(-r * 0.34, -r * 0.34, r * 0.68, r * 0.68);
    ctx.restore();
  } else if (type === 'host') {
    ctx.beginPath(); ctx.arc(p[0], p[1], 5.5 * s, 0, Math.PI * 2);
    ctx.fillStyle = '#2ED3C6'; ctx.fill();
  } else if (type === 'paid') {
    ctx.beginPath(); ctx.arc(p[0], p[1], 4.6 * s, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(46,211,198,.9)'; ctx.lineWidth = 2; ctx.stroke();
  } else if (type === 'free') {
    ctx.beginPath(); ctx.arc(p[0], p[1], 3 * s, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(234,241,248,.85)'; ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(p[0], p[1], 3.4 * s, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(234,241,248,.7)'; ctx.lineWidth = 1.2; ctx.stroke();
  }
}

function regional(now, a) {
  ctx.save(); ctx.globalAlpha = a;

  ctx.beginPath();
  ARCS.forEach(arc => path(arc.full));
  ctx.strokeStyle = 'rgba(46,211,198,.13)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath();
  ARCS.forEach((arc, i) => {
    const prog = ((now / 4200) + i / ARCS.length) % 1;
    const n = arc.pts.length - 1;
    const hi = Math.round(prog * n), lo = Math.max(0, hi - Math.round(0.18 * n));
    if (hi - lo > 1) path({ type: 'LineString', coordinates: arc.pts.slice(lo, hi + 1) });
  });
  ctx.strokeStyle = 'rgba(46,211,198,.75)'; ctx.lineWidth = 1.8; ctx.stroke();

  // at this scale only the gems, hosts and partners are legible
  // Gems and hosts first, partners last, so a partner is never painted over
  // by a dot that happens to come later in the array. Ordering IS the
  // highlight at this size — a 3px marker has nothing else to give.
  PLACES.forEach((p, i) => {
    if (!filters[p.t]) return;
    if (p.t === 'free' || p.t === 'paid' || p.t === 'partner') return;
    const q = projection(p.c);
    if (p.t === 'gem') {
      const tw = 0.4 + 0.4 * Math.sin(now / 900 + i * 1.7);
      ctx.beginPath(); ctx.arc(q[0], q[1], 2.2, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(234,241,248,' + tw.toFixed(2) + ')'; ctx.lineWidth = 1; ctx.stroke();
    } else marker(q, p.t, now);
  });
  // A car park an agreement covers, drawn as the operator's rather than as
  // anonymous paid parking. APCOA's four sites are the live case.
  PLACES.forEach(p => {
    if (!p.op || !filters[p.t]) return;
    const q = projection(p.c);
    ctx.beginPath(); ctx.arc(q[0], q[1], 3.4, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(46,211,198,.9)'; ctx.lineWidth = 1.4; ctx.stroke();
  });
  PLACES.forEach(p => {
    if (p.t !== 'partner' || !filters.partner || !p.pinnable) return;
    const q = projection(p.c);
    // A slow halo, so the eye finds them without the map turning into a
    // disco. Partners are a handful of points among 744.
    const pulse = 5.5 + 2.2 * (0.5 + 0.5 * Math.sin(now / 1100));
    ctx.beginPath(); ctx.arc(q[0], q[1], pulse, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(46,211,198,.28)'; ctx.lineWidth = 1.2; ctx.stroke();
    marker(q, 'partner', now);
  });

  const placed = [];
  TOWNS.forEach(t => {
    const q = projection(t.c);
    const r = t.rank === 0 ? 4 : t.rank === 1 ? 3 : 2.2;
    ctx.beginPath(); ctx.arc(q[0], q[1], r, 0, Math.PI * 2);
    ctx.fillStyle = t.rank === 0 ? '#EAF1F8' : t.rank === 1 ? 'rgba(234,241,248,.8)' : 'rgba(234,241,248,.5)';
    ctx.fill();
  });
  TOWNS.slice().sort((x, y) => x.rank - y.rank).forEach(t => {
    label(t.n.toUpperCase(), projection(t.c), placed, {
      size: t.rank === 0 ? 12 : t.rank === 1 ? 11 : 10,
      weight: t.rank === 0 ? 700 : 600,
      colour: t.rank === 0 ? '#EAF1F8' : t.rank === 1 ? 'rgba(226,233,242,.92)' : 'rgba(160,173,190,.85)',
      nudge: t.dy || 0
    });
  });
  ctx.restore();
}

function closeUp(now, a) {
  if (!city) return;
  // WHAT THE RINGS MEASURE FROM. The town, until a space is selected — then the
  // space, because "how far is this from the middle of Belfast" is not the
  // question somebody asks after tapping Wellington Place. They want to know
  // what is within a five minute walk of it.
  const focus = (mode === 'place' && selected) ? selected : city;
  const centre = projection(focus.c);
  const townPt = projection(city.c);
  ctx.save(); ctx.globalAlpha = a;

  const kmPx = view.scale / 6371;
  ringsFor(kmPx, Math.min(W - mapLeft(), H) * 0.52).forEach(km => {
    ctx.beginPath(); ctx.arc(centre[0], centre[1], km * kmPx, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(234,241,248,.10)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.font = '600 9px Manrope, sans-serif'; ctx.fillStyle = 'rgba(124,139,161,.85)';
    ctx.fillText(ringLabel(km), centre[0] + 5, centre[1] - km * kmPx - 4);
  });

  const placed = [];
  // The town keeps its own dot wherever it happens to fall — at street level
  // that is usually off to one side, which is the orientation somebody needs.
  ctx.beginPath(); ctx.arc(townPt[0], townPt[1], 5, 0, Math.PI * 2);
  ctx.fillStyle = '#EAF1F8'; ctx.fill();
  // Its NAME waits its turn when a space is selected. Labels are placed
  // first-come-first-served, and on a 414px screen "BELFAST" claimed the one
  // box that "WELLINGTON PLACE ON-STREET" could have fitted in — so the map
  // zoomed to the space Marty asked for and then declined to name it.
  const townLabel = () => label(city.n.toUpperCase(), townPt, placed,
    { size: 13, weight: 700, colour: '#EAF1F8' });
  if (mode !== 'place') townLabel();

  (AREAS[city.n] || []).forEach(area => {
    const q = projection(area.c);
    ctx.beginPath(); ctx.arc(q[0], q[1], 3, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(183,194,208,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
    label(area.n.toUpperCase(), q, placed, { size: 10, weight: 600, colour: 'rgba(160,173,190,.8)' });
  });

  // pinnable !== false is the gate, and it belongs here as much as on the NI
  // view. Without it the city zoom labelled MARCUS DONNELLY FITNESS on a
  // Belfast street — an online-only coaching business with no premises, sitting
  // on the city-centre placeholder its NOT NULL columns demand. A label on a
  // map is a claim that something is THERE. He is in the list and the search,
  // which is where a partner without a door belongs.
  // Measured from the focus, so a street-level view is populated by what is
  // near the SPACE. Filtering on the town centre left a space out on the edge
  // of the city looking at an empty screen with everything 20km behind it.
  //
  // The selected place is always included: it can be further from its own town
  // centre than the radius, and the one marker that must never be missing from
  // this view is the one the panel is describing.
  const reach = mode === 'place' ? 6 : 26;
  const here = PLACES.filter(p => filters[p.t] && Number.isFinite(p.c?.[0])
    && (selected && p.id === selected.id
        || (p.pinnable !== false && d3.geoDistance(p.c, focus.c) * 6371 < reach)));
  const order = { free: 0, gem: 1, paid: 2, host: 3, partner: 4 };
  const sorted = here.slice().sort((x, y) => order[x.t] - order[y.t]);
  const isSel = p => selected && selected.id === p.id;
  const kmFrom = p => d3.geoDistance(p.c, focus.c) * 6371;

  // MARKERS for everything in reach — a dot is cheap and gives the street
  // context. LABELS are rationed below, because text is not.
  sorted.forEach(p => {
    const q = projection(p.c);
    if (isSel(p)) {
      const k = (now % 1600) / 1600;
      ctx.beginPath(); ctx.arc(q[0], q[1], 12 + k * 26, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(234,241,248,' + (0.6 * (1 - k)) + ')'; ctx.lineWidth = 1.5; ctx.stroke();
    }
    marker(q, p.t, now, isSel(p));
  });

  // WHICH ONES GET NAMED.
  //
  // The first attempt at the close-up labelled every space within 6km, which
  // at this scale is forty-odd names filling the frame edge to edge — and the
  // one the panel was describing looked exactly like the other thirty-nine.
  // Getting closer has to mean seeing MORE about one space, not more text.
  //
  // So: the selected space first, so it wins the collision contest outright
  // (label() places first-come-first-served), then what is genuinely within a
  // few minutes' walk, nearest first, capped.
  const sel = sorted.find(isSel);
  let named;
  if (mode === 'place') {
    // Nine names fit a laptop and bury a phone. The cap is the screen's, not
    // a number picked once and applied everywhere.
    named = sorted
      .filter(p => !isSel(p) && kmFrom(p) <= 0.6)
      .sort((a, b) => (order[b.t] - order[a.t]) || (kmFrom(a) - kmFrom(b)))
      .slice(0, W > 820 ? 9 : 4);
  } else {
    named = sorted.filter(p => !isSel(p) && (p.t === 'host' || p.t === 'partner'));
  }
  if (sel) named.unshift(sel);

  named.forEach(p => {
    const q = projection(p.c);
    // The selected one is bigger, white, and forced: it is the single thing
    // this view exists to show, so it is the one label allowed to sit where it
    // does not quite fit rather than be dropped.
    label(p.n.toUpperCase(), q, placed, isSel(p)
      ? { size: 13, weight: 800, colour: '#FFFFFF', gap: 15, force: true }
      : { size: 11, weight: 700, colour: p.t === 'partner' ? '#BFF1EC' : '#8BEFE4', gap: 12 });
  });
  if (mode === 'place') townLabel();
  ctx.restore();
}

function label(text, p, placed, o) {
  const size = o.size, gap = o.gap || (size > 11 ? 10 : 7);
  ctx.font = o.weight + ' ' + size + 'px Manrope, sans-serif';
  const w = ctx.measureText(text).width;
  const box = (x1, dy) => ({ x1: x1 - 2, y1: p[1] + dy - size * 0.7, x2: x1 + w + 2, y2: p[1] + dy + size * 0.45 });
  const b = labelBounds();
  const inside = r => r.x1 >= b.x0 && r.x2 <= b.x1 && r.y1 >= b.y0 && r.y2 <= b.y1;
  // A position that collides OR runs off the map is no position at all. Text
  // clipped by the canvas edge reads as a bug; a name that simply is not there
  // reads as a map with room to breathe.
  const hits = r => !inside(r) || placed.some(q => !(r.x2 < q.x1 || r.x1 > q.x2 || r.y2 < q.y1 || r.y1 > q.y2));
  const n = o.nudge || 0;
  const tries = [
    [p[0] + gap, n], [p[0] - gap - w, n], [p[0] + gap, 0], [p[0] - gap - w, 0],
    [p[0] - w / 2, -gap - size * 0.5], [p[0] - w / 2, gap + size * 0.6],
    [p[0] + gap, -size - 1], [p[0] - gap - w, -size - 1],
    [p[0] + gap, size + 1], [p[0] - gap - w, size + 1]
  ];
  let found = tries.map(([x, dy]) => ({ x, dy, r: box(x, dy) })).find(t => !hits(t.r));
  if (!found) {
    outer:
    for (let d = 18; d <= 72; d += 10) {
      for (let i = 0; i < 8; i++) {
        const ang = i * Math.PI / 4;
        const dx = Math.cos(ang) * d, dy = Math.sin(ang) * d;
        const x = dx < 0 ? p[0] + dx - w : p[0] + dx;
        const r = box(x, dy);
        if (!hits(r)) { found = { x, dy, r, leader: true }; break outer; }
      }
    }
  }
  if (!found && o.force) {
    // Below the marker, slid horizontally until it is on the map. Collisions
    // are accepted here; a missing name is not.
    const x = Math.max(b.x0, Math.min(b.x1 - w - 4, p[0] - w / 2));
    const dy = gap + size * 0.6;
    found = { x, dy, r: box(x, dy) };
  }
  if (!found) return;
  placed.push(found.r);
  if (found.leader) {
    ctx.beginPath(); ctx.moveTo(p[0], p[1]);
    ctx.lineTo(found.x < p[0] ? found.x + w + 3 : found.x - 3, p[1] + found.dy);
    ctx.strokeStyle = 'rgba(160,173,190,.4)'; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.fillStyle = o.colour;
  ctx.fillText(text, found.x, p[1] + found.dy + size * 0.35);
}

window.addEventListener('resize', resize);
document.addEventListener('visibilitychange', schedule);

const res = (id, fallback) => (window.__resources && window.__resources[id]) || fallback;

// ── LIVE LAYERS ──────────────────────────────────────────────────────────────
// Partners and host car parks live in the database, not in this repo. Baking
// them into places.json would mean a partner who ends their placement stays
// pinned on the globe until somebody remembers to rebuild — the same staleness
// that had the shipped version showing "APCOA pilot" for two listings that are
// unsigned drafts.
//
// So they are fetched at load, through the same public REST endpoint and anon
// key the app itself uses, with RLS deciding what is visible. If the request
// fails or the config is absent, these layers are simply MISSING rather than
// wrong: the 745 generated spaces still render and the page still works.
const CFG = window.__PARKEASY__ || {};

async function fetchJSON(path) {
  if (!CFG.url || !CFG.key) return [];
  try {
    const r = await fetch(CFG.url + path, {
      headers: { apikey: CFG.key, Authorization: 'Bearer ' + CFG.key },
    });
    return r.ok ? await r.json() : [];
  } catch { return []; }
}

function nearestTown(c) {
  if (!Number.isFinite(c?.[0])) return TOWNS[0].n;
  let best = TOWNS[0], bd = Infinity;
  for (const t of TOWNS) { const d = d3.geoDistance(c, t.c); if (d < bd) { bd = d; best = t; } }
  return best.n;
}

async function livePartners() {
  const [partners, listings] = await Promise.all([
    // EVERY active partner now, not only the pinnable ones. The two awkward
    // cases are handled rather than filtered out, because dropping a partner
    // off the partner map is the one outcome nobody wants:
    //
    //   NO TRUSTED PIN (geo_verified false) — the coordinate is the
    //     city-centre placeholder the NOT NULL columns demand. Still listed and
    //     searchable, but NOT drawn: a pin is a claim about a street. APCOA is
    //     the live case and it loses nothing, because its four Northern Irish
    //     car parks are already on the map with surveyed coordinates and are
    //     badged as its own (see `op` in places.json).
    //
    //   ONLINE ONLY (is_online) — Marcus Donnelly Fitness has no premises at
    //     all. Listed, labelled "Online", never pinned. Putting a dot on
    //     Belfast city centre for a remote coaching business would be inventing
    //     a place, which is the thing this whole page had to be rebuilt to stop.
    fetchJSON('/rest/v1/partners?select=name,lat,lng,geo_verified,is_online,priority&active=is.true&order=priority.desc'),
    fetchJSON('/rest/v1/listings_public?select=title,lat,lng,status&status=eq.active'),
  ]);
  return [
    ...partners.map(p => ({
      t: 'partner', n: p.name, c: [p.lng, p.lat], priority: p.priority || 0,
      online: !!p.is_online,
      // The partners table has no town column, and every list path calls
      // p.town.toLowerCase() — so without this, typing anything into the
      // search box threw and the results went blank. Nearest of the towns we
      // already know, which is also the town panel a partner should appear in.
      town: nearestTown([p.lng, p.lat]),
      // pinnable decides whether it gets a dot. Everything unpinnable still
      // reaches the list, the search and the town panel.
      pinnable: !p.is_online && p.geo_verified === true && Number.isFinite(p.lat),
    })),
    ...listings.filter(l => Number.isFinite(l.lat))
      .map(l => ({ t: 'host', n: l.title, c: [l.lng, l.lat],
                   town: nearestTown([l.lng, l.lat]), pinnable: true })),
  ];
}

// ── WHY A DRIVER SHOULD PICK A PARTNER ───────────────────────────────────────
// Not "because we were paid". Because parking there is already solved — which
// is the entire thesis of the product and the only honest reason to push one
// business over another on a parking map.
//
// So every partner is measured against the real spot data: how many spaces sit
// within a few minutes' walk of its door. That number is computed from the 744
// surveyed coordinates, it is shown on the row, and it is what the ordering
// below is built on. A partner with parking round the corner earns its place at
// the top; one with none does not get a fake one.
//
// WHAT THIS DELIBERATELY DOES NOT DO: hide, demote or degrade a non-partner
// spot. Every free bay, gem and car park stays exactly where it was and ranks
// exactly as it did. Partners gain PROMINENCE — a brighter marker, the top of
// the list, a labelled badge — and never at the cost of the thing a driver
// actually came for. A parking app that buries parking to sell adverts stops
// being worth opening, and the trust is the moat.
const WALK_M_PER_MIN = 80;                 // ~4.8 km/h, the usual planning figure
const NEARBY_RADIUS_M = 500;               // about a six-minute walk

function metres(a, b) {
  return d3.geoDistance(a, b) * 6371000;
}

function attachParking(places) {
  const spaces = places.filter(p => p.t === 'free' || p.t === 'paid' || p.t === 'gem');
  places.filter(p => p.t === 'partner' || p.t === 'host').forEach(p => {
    // ONLY WHERE THE PIN IS REAL. An unpinnable partner carries the
    // city-centre placeholder its NOT NULL columns demand, so counting spaces
    // around it measures the middle of Belfast and calls it that business's
    // parking. The first run said "Marcus Donnelly Fitness: 21 spaces within
    // 500m" — for a partner with no premises at all. Worse than useless: it is
    // a specific, confident, invented number on the row a driver reads.
    if (!p.pinnable || !Number.isFinite(p.c?.[0])) return;
    let near = 0, closest = Infinity;
    for (const s of spaces) {
      const d = metres(p.c, s.c);
      if (d < NEARBY_RADIUS_M) near++;
      if (d < closest) closest = d;
    }
    p.nearby = near;
    p.walkMin = Number.isFinite(closest) ? Math.max(1, Math.round(closest / WALK_M_PER_MIN)) : null;
  });
}

// Partners first, then whatever has parking nearest, then the editorial order
// Marty set in the database. Used for the list only — the map still draws
// everything.
function partnerRank(p) {
  if (p.t !== 'partner' && p.t !== 'host') return 3;
  return p.nearby > 0 ? 0 : (p.pinnable ? 1 : 2);
}
function byPartnerFirst(a, b) {
  return partnerRank(a) - partnerRank(b)
      || (b.nearby || 0) - (a.nearby || 0)
      || (b.priority || 0) - (a.priority || 0);
}

// Counted at build time from the same arrays the app renders, never typed.
function paintStats(stats) {
  if (!stats) return;
  const row = document.querySelector('.stats');
  if (!row) return;
  // THE TILES MUST MATCH THE SCOPE THE HEADLINE CLAIMS, and the headline no
  // longer says Northern Ireland — so these are the island-wide totals. When
  // the page was headlined "Every space Northern Ireland already has" these
  // read spacesNi/gemsNi/townsNi, because counting Dublin and Galway under
  // that sentence would have overstated it by everything south of the border.
  //
  // The pairing is the rule, not either number: tests/unit/regionSplit.test.mjs
  // reads the headline and requires the tiles to agree with it, in whichever
  // direction. Both counts are in the generated data, so flipping the scope is
  // a change of three words and three fields, never a recount.
  const cells = [
    [stats.spaces, 'Spaces mapped'],
    [stats.gems, 'Hidden gems'],
    [stats.towns, 'Towns covered'],
    // The split used to be the fourth tile, quoting the host's percentage.
    // Marty pulled it, here and from the in-app hosts card, for one reason: a
    // treasurer reading a percentage is doing arithmetic, not signing up. The
    // number is not a secret and it is still on /hosts, in full, next to the
    // worked examples where somebody deciding actually wants it. This tile now
    // says the thing that gets them to look.
    ['Free', 'To list a space'],
  ];
  row.innerHTML = cells.map(([v, l]) => `<div class="stat"><b>${v}</b><i>${l}</i></div>`).join('');
}

Promise.all([
  d3.json('/globe/countries-110m.json'),
  d3.json('/globe/ni-ireland.json'),
  d3.json('/globe/places.json'),
  livePartners(),
  // Absent rather than fatal: the overlays are a reference layer, and the
  // coverage map is the page's actual job. Same discipline as livePartners().
  d3.json('/globe/markets.json').catch(() => null)
]).then(([topo, local, places, partners, markets]) => {
  if (markets) MARKETS = {
    hotspots: Array.isArray(markets.hotspots) ? markets.hotspots : [],
    operators: Array.isArray(markets.operators) ? markets.operators : []
  };
  land = topojson.merge(topo, topo.objects.countries.geometries);
  ni = local.ni;
  ireland = local.ireland;
  AREAS = places.areas || {};
  let i = 0;
  PLACES = [
    // Partners come from the database at load, not from a generated file:
    // they change without a deploy, and a partner page that has been taken
    // down should not go on being pinned here. Absent rather than stale when
    // the fetch fails.
    ...partners,
    // The real name when the generator supplied one — 743 of 745 do, and
    // "Twin Spires Complex car park" is a far better search result than
    // "Free space". Hidden gems fall back to their AREA label or the generic,
    // never their name: that is what Premium buys.
    ...places.spaces.map(s => ({ ...s, n: s.n || (TYPES[s.t].label + ' space') }))
  ].map(p => ({ ...p, id: p.t + '-' + (i++) }));
  attachParking(PLACES);
  // Before the first renderList, so every town with spots is searchable and
  // labelled from the outset rather than appearing after some later redraw.
  foldInDataTowns(PLACES);
  paintStats(places.stats);
  buildFilters();
  buildLayerToggles();
  renderList();
  resize();
  view = cameraFor('globe');
  schedule();
});
resize();
</script>
</body>
