name: iOS release (App Store)

# Builds the ParkEasy iOS app on GitHub's macOS runners — no Mac needed.
#
# TWO MODES, chosen automatically:
#   check     always: compiles the app for the iOS Simulator with signing off.
#             Proves the Xcode project, Swift packages and web build are sound.
#   release   when the APPLE_* secrets are set: archives for device, signs with
#             the distribution certificate, exports an App Store .ipa and
#             UPLOADS it to App Store Connect (TestFlight) in the same run.
#
# Run from GitHub → Actions → "iOS release (App Store)" → Run workflow, or push
# a tag like `ios-v1.0.0`. Web changes never need this: the app loads the live
# site. Only a shell change (icon, permission, Capacitor bump) does.
#
# SECRETS for release mode (Settings → Secrets and variables → Actions),
# all explained step by step in docs/IOS_RELEASE.md:
#   APPLE_TEAM_ID              10 characters, from developer.apple.com → Membership
#   APPLE_CERT_P12_BASE64      Apple Distribution certificate + private key as .p12, base64
#   APPLE_CERT_PASSWORD        the .p12 password
#   APPLE_API_KEY_ID           App Store Connect API key ID
#   APPLE_API_ISSUER_ID        App Store Connect API issuer ID
#   APPLE_API_KEY_P8_BASE64    the .p8 key file, base64

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown on the store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'ios-v*'

permissions:
  contents: read

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Work out version and build number
        run: |
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REF_NAME#ios-v}"; fi
          echo "IOS_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          # Build number must rise with every upload of the same version.
          echo "IOS_BUILD_NUMBER=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          echo "version=$NAME build=$((GITHUB_RUN_NUMBER + 100))"

      - name: Decide check or release
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$P12" ] && [ -n "$KEY" ]; then
            echo "RELEASE=1" >> "$GITHUB_ENV"; echo "::notice::Apple secrets present — building, signing and uploading to App Store Connect."
          else
            echo "RELEASE=0" >> "$GITHUB_ENV"; echo "::warning::No APPLE_* secrets — compile check only (simulator, unsigned)."
          fi

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Build web
        run: npx vite build

      - name: Sync Capacitor → ios/
        run: npx cap sync ios

      - name: Apply release patches (permissions, privacy manifest, entitlements)
        run: node scripts/ios-prepare.mjs

      - name: Resolve Swift packages
        working-directory: ios/App
        run: xcodebuild -resolvePackageDependencies -project App.xcodeproj -scheme App

      # ---------------------------------------------------------- check mode
      - name: Compile check (simulator, unsigned)
        working-directory: ios/App
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$IOS_VERSION_NAME" CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            build | tail -40

      # -------------------------------------------------------- release mode
      - name: Import distribution certificate
        if: env.RELEASE == '1'
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Write App Store Connect API key
        if: env.RELEASE == '1'
        env:
          KEY: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY" | base64 -d > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          echo "ASC_KEY_PATH=$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Archive (device, signed)
        if: env.RELEASE == '1'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="$IOS_VERSION_NAME" CURRENT_PROJECT_VERSION="$IOS_BUILD_NUMBER" \
            archive | tail -40

      - name: Export .ipa and upload to App Store Connect
        if: env.RELEASE == '1'
        working-directory: ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" | tail -40
          ls -la "$RUNNER_TEMP/export" || true

      - name: Upload export log / ipa as artifact
        if: env.RELEASE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: ParkEasy-ios-export
          path: ${{ runner.temp }}/export
          if-no-files-found: ignore
          retention-days: 30

      - name: Clean up keychain
        if: always() && env.RELEASE == '1'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
