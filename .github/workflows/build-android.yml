name: Android release (Play Store)

# Builds the Android App Bundle (.aab) that gets uploaded to Google Play, plus
# an .apk for installing straight onto a phone to test the exact same build.
#
# TWO MODES, chosen automatically:
#   signed    the four ANDROID_* repository secrets are set → the outputs are
#             signed with the upload key and ready to upload to Play as they are.
#   unsigned  no secrets → the outputs are built unsigned and published to the
#             `android-builds` branch of this repo, from which they are signed
#             with the upload keystore on a machine that holds it:
#               jarsigner -keystore parkeasy-upload.jks -signedjar signed.aab unsigned.aab parkeasy-upload
#             (docs/ANDROID_RELEASE.md). This is how the first builds were made
#             before the secrets existed; it is also the fallback if they ever
#             have to be rotated.
#
# Run it from GitHub → Actions → "Android release (Play Store)" → Run workflow,
# or push a tag like `android-v1.0.0`. It does NOT run on every push to main:
# the Android app loads the live parkeasy.uk site, so web changes reach app
# users the moment Vercel deploys — a new store build is only needed when the
# native shell itself changes (icon, permissions, Capacitor upgrade).
#
# SECRETS (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   the upload keystore, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS         parkeasy-upload
#   ANDROID_KEY_PASSWORD      (same as the keystore password)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown on the store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
  push:
    tags:
      - 'android-v*'

permissions:
  contents: write   # to publish unsigned outputs to the android-builds branch

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Every run is a higher number than the last, which Play requires. The
      # +100 offset keeps it above any versionCode uploaded by hand before this.
      # The version name comes from the Run-workflow box, or the tag with its
      # `android-v` prefix removed.
      - name: Work out version code and name
        run: |
          echo "ANDROID_VERSION_CODE=$((GITHUB_RUN_NUMBER + 100))" >> "$GITHUB_ENV"
          NAME="${{ inputs.version_name }}"
          if [ -z "$NAME" ]; then NAME="${GITHUB_REF_NAME#android-v}"; fi
          echo "ANDROID_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "versionCode=$((GITHUB_RUN_NUMBER + 100)) versionName=$NAME"

      - name: Decide signed or unsigned
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "SIGNED=1" >> "$GITHUB_ENV"
            echo "::notice::Signing secrets present — building a signed release."
          else
            echo "SIGNED=0" >> "$GITHUB_ENV"
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — building UNSIGNED and publishing to the android-builds branch for signing elsewhere."
          fi

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      # The shell loads https://parkeasy.uk, so the bundled web build is only a
      # fallback screen — but Capacitor requires webDir to exist to sync.
      - name: Build web
        run: npx vite build

      - name: Sync Capacitor → android/
        run: npx cap sync android

      - name: Apply release patches (permissions, signing, splash)
        run: node scripts/android-prepare.mjs

      - name: Decode upload keystore
        if: env.SIGNED == '1'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build App Bundle and APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Collect outputs
        run: |
          mkdir -p out
          SUFFIX=""; [ "$SIGNED" = "1" ] || SUFFIX="-unsigned"
          cp android/app/build/outputs/bundle/release/app-release.aab "out/ParkEasy-${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}${SUFFIX}.aab"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "out/ParkEasy-${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}${SUFFIX}.apk"
          cat > out/BUILD.txt <<EOF
          versionName=${ANDROID_VERSION_NAME}
          versionCode=${ANDROID_VERSION_CODE}
          signed=${SIGNED}
          commit=${GITHUB_SHA}
          run=${GITHUB_RUN_ID}
          EOF
          ls -la out

      - name: Upload .aab (upload this one to Google Play)
        uses: actions/upload-artifact@v4
        with:
          name: ParkEasy-play-store-bundle
          path: out/*.aab
          retention-days: 90

      - name: Upload .apk (install this one on a phone to test)
        uses: actions/upload-artifact@v4
        with:
          name: ParkEasy-test-apk
          path: out/*.apk
          retention-days: 90

      # Unsigned outputs are also pushed to a branch: nothing in them is secret
      # (the same bytes are in the public artifact above) and a branch can be
      # fetched with plain git from anywhere, which the Actions artifact API
      # cannot always be. One commit per build, history kept.
      - name: Publish unsigned outputs to the android-builds branch
        if: env.SIGNED == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DIR="builds/${ANDROID_VERSION_NAME}-${ANDROID_VERSION_CODE}"
          if git fetch --depth 1 origin android-builds 2>/dev/null; then
            git worktree add /tmp/builds origin/android-builds
          else
            git worktree add --detach /tmp/builds
            (cd /tmp/builds && git checkout --orphan android-builds && git rm -rfq . && git clean -fdxq)
          fi
          mkdir -p "/tmp/builds/$DIR" && cp out/* "/tmp/builds/$DIR/"
          cd /tmp/builds
          git add -A
          git commit -qm "Unsigned Android build ${ANDROID_VERSION_NAME} (${ANDROID_VERSION_CODE}) from ${GITHUB_SHA::7}"
          git push origin HEAD:android-builds
          echo "::notice::Published to branch android-builds at $DIR"
